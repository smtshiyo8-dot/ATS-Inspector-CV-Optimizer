<!DOCTYPE html>
<html>
<head>
    <title>ATS Inspector & CV Optimizer</title>
</head>
<body>
    <h2>ATS Inspector & CV Optimizer</h2>
    <form id="cvForm" enctype="multipart/form-data">
        <label>Upload your CV:</label><br>
        <input type="file" name="file" required><br><br>

        <label>Paste Job Description:</label><br>
        <textarea name="job_description" rows="6" cols="60" placeholder="Paste job ad here..."></textarea><br><br>

        <button type="submit">Analyze CV</button>
    </form>

    <div class="mb-3">
        <label for="outputFormat" class="form-label">Choose Output Format</label>
        <select class="form-select" id="outputFormat" name="output_format" required>
        <option value="pdf" selected>PDF</option>
        <option value="docx">Word (.docx)</option>
        </select>
    </div>


    <h3>✅ CV Analysis Results</h3>
    <pre id="results"></pre>

    <script>
        const form = document.getElementById("cvForm");
        const resultsCard = document.getElementById("results-card");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();

            const formData = new FormData();
            const fileInput = document.getElementById("cvInput");
            const jobDescription = document.getElementById("jobDescription")?.value || "";
            const outputFormat = document.getElementById("outputFormat").value;

            if (!fileInput.files.length) return;

            formData.append("file", fileInput.files[0]);
            formData.append("job_description", jobDescription);
            formData.append("output_format", outputFormat);

            try {
                const res = await fetch("/process-cv", {
                    method: "POST",
                    body: formData
                });

            const data = await res.json();

            if (res.ok) {
                // Populate results
                document.getElementById("res-filename").textContent = data.filename || "Unknown";
                document.getElementById("res-ats").textContent = data.ats_detected || "Unknown";
                document.getElementById("res-score").textContent = data.cv_score || "N/A";

                // Improvements list
                const improvementsList = document.getElementById("res-improvements");
                improvementsList.innerHTML = "";
                if (data.improvements && data.improvements.length > 0) {
                    data.improvements.forEach(item => {
                        const li = document.createElement("li");
                        li.textContent = item;
                        improvementsList.appendChild(li);
                    });
                } else {
                    improvementsList.innerHTML = "<li>No suggestions provided.</li>";
                }

                // Download link with dynamic label
                const downloadBtn = document.getElementById("res-download");
                if (data.modified_cv_url) {
                    downloadBtn.style.display = "inline-block";
                    downloadBtn.href = data.modified_cv_url;

                    if (data.filename.endsWith(".docx")) {
                        downloadBtn.textContent = "⬇ Download Optimized CV (Word)";
                    } else {
                        downloadBtn.textContent = "⬇ Download Optimized CV (PDF)";
                    }
                } else {
                    downloadBtn.style.display = "none";
                }

                // Show results card
                resultsCard.style.display = "block";
            } else {
                alert("❌ Error: " + (data.error || "Something went wrong."));
            }
        } catch (err) {
            alert("❌ Error uploading CV. Please try again.");
        }
    });
</script>

</body>
</html>
